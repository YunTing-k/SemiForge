[paths]
# Copy this file, then replace these three paths for a new device.
data_dir = D:/replace_with_new_device/static_iv_cv
hysteresis_data_dir = D:/replace_with_new_device/hysteresis_it
output_dir = ../../outputs/new_device
# Optional: leave empty to use DG_TFT_HSPICE_EXE/HSPICE_EXE or system PATH.
hspice_exe =

[runtime]
device = auto
dtype = float32
seed = 20260524
minimal_run = no

[preprocessing]
iv_stage_alignment = auto
iv_stage_max_shift_V = 0.75
iv_stage_min_matches = 2

[physical_fit]
max_iv_points = 50000
max_cv_points = 100000
max_nfev_scale = 1.0

[base_pkan]
# KAN architecture hyper-parameters (read by workflow agents).
# The engine receives these via CLI args from run_model.py.
epochs_shared = 500
epochs_iv = 700
epochs_cv = 700
kan_hidden = 12
kan_grid = 5
kan_k = 3
batch_iv = 4096
batch_cv = 512

[full_model]
epochs = 700
learning_rate = 0.0012
batch_iv = 4096
batch_cv = 512
cv_weight = 10.0
cv_train_subset = primary_gate_cv
reset_base_from_physical_fit = yes
train_base_iv_pkan = yes
base_iv_epochs = 700
base_iv_restarts = 1
base_iv_learning_rate = 0.002
base_iv_eval_every = 20
base_iv_top1_symbolic_weight = 0.35
base_iv_top1_sparsity_weight = 0.001
base_iv_top1_selection_weight = 0.08
base_iv_max_top1_compatibility = 0.015
train_iv_residual_stage = yes
iv_residual_stage_epochs = 700
iv_residual_stage_learning_rate = 0.002
iv_residual_stage_linear_weight = 0.25
iv_residual_stage_deriv_curves = 36
iv_residual_stage_shape_period = 3
iv_residual_holdout_stride = 5
iv_residual_off_anchor_weight = 2.0
freeze_iv_residual_after_stage = yes
base_pkan_lr_mult = 1.0
warm_start_base_pkan_lr_mult = 0.035
cv_residual_level = 1
enable_cv_residual = yes
# Freeze the accepted base during CV/residual training; rerun the dedicated
# base stage instead of allowing CV gradients to erode IV accuracy.
finetune_base_pkan = no
# Fresh-device policy: start all bounded IV physical-parameter heads active.
# The device's own held-out audit reports later deployment candidates.
disabled_iv_pkan =
# CV remains structurally constrained: legacy base-CV redundancies and the
# 14 non-release charge slots stay inactive unless device-specific evidence
# justifies an explicit experiment.
disabled_cv_pkan = dVtrap_center_cv_V,dlog_tau_cv,dlog_cpl_t_cv,dlog_cpl_b_cv,dlog_Cbody_cv,dlog_wch_cv
disabled_cv_charge_pkan = dvc_common_raw,dvc_asym_raw,dlog_sigma_common_raw,dlog_sigma_asym_raw,dlog_cit_asym_raw,dtail_frac_raw,dtail_width_raw,dtail_shift_raw,ddeep_frac_raw,ddeep_width_raw,ddeep_shift_raw,tb_amp_raw,tb_center_raw,tb_width_raw
early_stop_patience = 5
early_stop_min_epochs = 220
symbolic_training_weight = 0.05
print_every = 10
eval_every = 40
weight_decay = 1e-6
grad_clip = 5.0
lr_eta_min_frac = 0.02
staged_loss_schedule = yes
shape_eval_period = 5
shape_early_period = 20
shape_middle_period = 10

[validation]
joint_cv_safe_scale_search = no
safe_scale_steps = 8

[symbolic]
# Batched execution keeps the exported topology/checkpoint schema unchanged.
# Patience counts validation checks; zero disables stopping. Maximum iteration
# budgets and cosine scheduler horizons remain unchanged. Best states include
# step zero when stopping is enabled. min_delta is an absolute score change.
device_iv_finetune_eval_period = 100
device_iv_finetune_patience = 6
device_iv_finetune_min_steps = 500
device_iv_finetune_min_delta = 0.0001
device_iv_measured_eval_period = 50
device_iv_measured_patience = 6
device_iv_measured_min_steps = 300
device_iv_measured_min_delta = 0.0001
edge_topk = 1
iv_edge_topk = 1
# IV starts from Top-1. Promote only edges whose Top-1 replacement MSE exceeds
# this threshold; CV and temperature remain strict Top-1. Setting zero disables
# fallback and makes IV strict Top-1.
iv_adaptive_top2_mse = 0.0015
iv_calibration_max_terms = 24
# The strict numeric-to-symbolic terminal gate remains mandatory. Only the
# measured-relative regional budget is relaxed after adaptive Top-2, because
# it includes the irreducible numeric-model-to-measurement error.
measured_full_curve_policy = deployment_fidelity
measured_region_degradation_budget_dec = 0.030
measured_slope_degradation_budget_dec_per_V = 0.50
edge_steps = 180
edge_finetune_steps = 80
network_finetune_steps = 360
device_iv_finetune_steps = 3000
device_iv_measured_steps = 5000
device_cv_finetune_steps = 650

[temperature]
mode = auto
minimum_span_K = 20.0
kan_scale = 0.35
kan_hidden = 8
kan_grid = 3
kan_k = 3

[hysteresis]
enabled = yes
regime = all
epochs = 1800
hidden_capture = 16
hidden_emission = 20
amp_parameterization = conservative
# Fast transients benefit from the bounded total/exchange parameterization and
# optimized schedule. Slow banks retain the v90 independent amplitudes and
# fixed-AdamW full-budget policy as a protected baseline.
fast_amp_parameterization = conservative
slow_amp_parameterization = independent
fast_optimizer_policy = optimized
slow_optimizer_policy = v90
fast_restarts = 1
slow_restarts = 2
print_every = 1

[deployment]
run_hspice = yes
export_dynamic_cv_nqs = no
maxstep_tau_divisor = 20
