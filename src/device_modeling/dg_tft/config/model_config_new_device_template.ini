[paths]
# Copy this file, then replace these three paths for a new device.
data_dir = D:/replace_with_new_device/static_iv_cv
hysteresis_data_dir = D:/replace_with_new_device/hysteresis_it
output_dir = ../../outputs/new_device
hspice_exe = /path/to/hspice.exe

[runtime]
device = auto
dtype = float32
seed = 20260524
minimal_run = no

[physical_fit]
max_iv_points = 50000
max_cv_points = 100000
max_nfev_scale = 1.0

[base_pkan]
epochs_shared = 500
epochs_iv = 700
epochs_cv = 700
kan_hidden = 12
kan_grid = 5
kan_k = 3
batch_iv = 4096
batch_cv = 512

[full_model]
epochs = 700
learning_rate = 0.002
batch_iv = 4096
batch_cv = 512
cv_weight = 8.0
cv_residual_level = 1
enable_cv_residual = yes
finetune_base_pkan = yes
early_stop_patience = 5
early_stop_min_epochs = 220
symbolic_training_weight = 0.015
print_every = 1

[temperature]
mode = auto
minimum_span_K = 20.0
kan_scale = 0.35

[hysteresis]
enabled = no
regime = all
epochs = 1800
hidden_capture = 16
hidden_emission = 20
amp_parameterization = conservative
print_every = 1

[deployment]
run_hspice = yes
maxstep_tau_divisor = 20
