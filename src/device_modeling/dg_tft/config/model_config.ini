[paths]
# Reproduction dataset for the currently delivered DG-TFT model.
data_dir = /path/to/static_iv_cv_xlsx
# The cleaned I-t workbooks are stored in the same directory.
hysteresis_data_dir = /path/to/hysteresis_it_xlsx
# New training runs are kept separate from supplied validated weights.
output_dir = ../../outputs/current_device_retrain
# Change only when HSPICE is installed elsewhere.
hspice_exe = /path/to/hspice.exe

[runtime]
device = auto
dtype = float32
seed = 20260524
quick_run = no

[physical_fit]
max_iv_points = 50000
max_cv_points = 100000
max_nfev_scale = 1.0

[base_pkan]
epochs_shared = 500
epochs_iv = 700
epochs_cv = 700
kan_hidden = 12
kan_grid = 5
kan_k = 3
batch_iv = 4096
batch_cv = 512

[full_model]
epochs = 700
learning_rate = 0.002
batch_iv = 4096
batch_cv = 512
cv_weight = 8.0
cv_residual_level = 1
enable_cv_residual = yes
finetune_base_pkan = yes
early_stop_patience = 5
early_stop_min_epochs = 220
symbolic_training_weight = 0.015

[temperature]
# Auto mode enables temperature KAN only when measured temperature span is sufficient.
mode = auto
minimum_span_K = 20.0
kan_scale = 0.35

[hysteresis]
enabled = yes
regime = all
epochs = 1800
hidden_capture = 16
hidden_emission = 20
amp_parameterization = conservative

[deployment]
run_hspice = yes
maxstep_tau_divisor = 20
