[paths]
# Portable default: this package includes the current cleaned IV/CV/I-t dataset.
# After moving the release folder to another PC, this relative path still works.
data_dir = ../../data/user_dataset
hysteresis_data_dir = ../../data/user_dataset

# New training runs are kept separate from supplied validated weights.
output_dir = ../../outputs/v95_production

# Optional. Leave empty to use DG_TFT_HSPICE_EXE/HSPICE_EXE or system PATH.
# Example: hspice_exe = C:/Synopsys/Hspice/WIN64/hspice.com
hspice_exe =

[runtime]
device = auto
dtype = float32
seed = 20260524

[preprocessing]
# auto applies an IV stage shift only when repeated physical bias conditions
# make the shift identifiable. It never aligns unique-VDS files against one
# another and therefore does not remove DIBL.
iv_stage_alignment = auto
iv_stage_max_shift_V = 0.75
iv_stage_min_matches = 2

[physical_fit]
max_iv_points = 50000
max_cv_points = 100000
max_nfev_scale = 1.0

[full_model]
# Fresh-device default: reconstruct physical parameters, then train a new base
# IV-PKAN from this data set before residual/CV training. No previous device's
# learned weights are required.
epochs = 700
learning_rate = 0.0012
batch_iv = 4096
batch_cv = 512
cv_weight = 10.0
cv_train_subset = primary_gate_cv
reset_base_from_physical_fit = yes
train_base_iv_pkan = yes
# Full new-device budget. Validation early stopping may finish sooner, but the
# budget is not shortened merely because one device converged early.
base_iv_epochs = 700
base_iv_restarts = 1
base_iv_learning_rate = 0.002
base_iv_eval_every = 20
# The numeric base is trained toward a strict top-1 analytic edge library.
# These are training priors, not relaxed deployment topology.
base_iv_top1_symbolic_weight = 0.35
base_iv_top1_sparsity_weight = 0.001
base_iv_top1_selection_weight = 0.08
base_iv_max_top1_compatibility = 0.015
train_iv_residual_stage = yes
iv_residual_stage_epochs = 700
iv_residual_stage_learning_rate = 0.002
iv_residual_stage_linear_weight = 0.25
iv_residual_stage_deriv_curves = 36
iv_residual_stage_shape_period = 3
iv_residual_holdout_stride = 5
iv_residual_off_anchor_weight = 2.0
freeze_iv_residual_after_stage = yes
# Fresh-start and warm-start are intentionally distinct. The 0.035 multiplier
# is allowed only for an explicitly compatible accepted warm checkpoint.
base_pkan_lr_mult = 1.0
warm_start_base_pkan_lr_mult = 0.035
cv_residual_level = 1
enable_cv_residual = yes
# The dedicated base stage has its own precision gate. Freeze it during the
# CV/residual stage so a large CV objective cannot undo IV accuracy.
finetune_base_pkan = no
# Start every physically bounded IV output active on a new data set. Held-out
# impact diagnostics may recommend pruning after training.
disabled_iv_pkan =
disabled_cv_pkan = dVtrap_center_cv_V,dlog_tau_cv,dlog_cpl_t_cv,dlog_cpl_b_cv,dlog_Cbody_cv,dlog_wch_cv
disabled_cv_charge_pkan = dvc_common_raw,dvc_asym_raw,dlog_sigma_common_raw,dlog_sigma_asym_raw,dlog_cit_asym_raw,dtail_frac_raw,dtail_width_raw,dtail_shift_raw,ddeep_frac_raw,ddeep_width_raw,ddeep_shift_raw,tb_amp_raw,tb_center_raw,tb_width_raw
early_stop_patience = 5
early_stop_min_epochs = 220
symbolic_training_weight = 0.05
# Progress and loss scheduling. Data are already resident device tensors, so
# larger batches/DataLoader prefetch are not assumed to improve every CPU/GPU.
print_every = 10
eval_every = 40
staged_loss_schedule = yes
shape_eval_period = 5
shape_early_period = 20
shape_middle_period = 10

[validation]
# Parameter-PKAN and charge-residual KAN are trained in sequence but share the
# final charge law. Validate their joint deployment scales rather than
# disabling each branch after an independent scan.
joint_cv_safe_scale_search = no
safe_scale_steps = 8

[symbolic]
# IV starts from Top-1; only validation-selected high-error edges may use the
# sparse adaptive Top-2 fallback below. CV and temperature remain strict
# Top-1. Historical weights/formulas are never used for a new device.
edge_topk = 1
iv_edge_topk = 1
# Promote only edges whose Top-1 replacement MSE exceeds this threshold.
# Setting zero disables fallback and makes IV strict Top-1.
iv_adaptive_top2_mse = 0.0015
iv_calibration_max_terms = 24
# The strict numeric-to-symbolic terminal gate remains mandatory. Only the
# measured-relative regional budget is relaxed after adaptive Top-2, because
# it includes the irreducible numeric-model-to-measurement error.
measured_full_curve_policy = deployment_fidelity
measured_region_degradation_budget_dec = 0.030
measured_slope_degradation_budget_dec_per_V = 0.50
edge_steps = 180
edge_finetune_steps = 80
network_finetune_steps = 360
device_iv_finetune_steps = 3000
# Curve-condition holdout selection protects measured Top-1 refinement from
# local curve overfit while retaining the strict one-function-per-edge form.
device_iv_measured_steps = 5000
device_cv_finetune_steps = 650

[temperature]
# Auto mode enables temperature KAN only when measured temperature span is sufficient.
mode = auto
minimum_span_K = 20.0
kan_scale = 0.35

[hysteresis]
enabled = yes
regime = all
# Batched KAN evaluation plus validation early stopping makes 1200 epochs a
# conservative ceiling rather than a mandatory runtime.  Increase only when
# the saved history still improves at the final checkpoint.
epochs = 1800
hidden_capture = 16
hidden_emission = 20
amp_parameterization = conservative
# Fast transients benefit from the bounded total/exchange parameterization and
# optimized schedule. Slow banks retain the v90 independent amplitudes and
# fixed-AdamW full-budget policy as a protected baseline.
fast_amp_parameterization = conservative
slow_amp_parameterization = independent
fast_optimizer_policy = optimized
slow_optimizer_policy = v90
fast_restarts = 1
slow_restarts = 2

[deployment]
run_hspice = yes
# HSPICE S-2021.09 can crash in DCOP when laplace_nd charge states are embedded
# in the static compact model. The validated release keeps static CV
# quasi-static; dynamic hysteresis is deployed by the separate two-state SRH
# RC module. Enable only after simulator-specific multi-frequency validation.
export_dynamic_cv_nqs = no
maxstep_tau_divisor = 20
